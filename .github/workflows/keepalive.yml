name: Mantener API despierta

# Render (plan gratuito) suspende la API tras 15 min sin tráfico y tarda ~50 s en despertar.
# Un ping cada 10 min la mantiene lista. Repositorio público: Actions no consume minutos de pago.
# Una sola instancia 24/7 ≈ 744 h/mes, dentro de las 750 h gratuitas de Render.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://agua-alerta-api.onrender.com/health; then exit 0; fi
            sleep 10
          done
          echo "::warning::La API no respondió al ping"
