# Blueprint de Render (plan gratuito) para la API de Agua Alerta.
# Guía completa: docs/11-infrastructure/free-deployment.md
services:
  - type: web
    name: agua-alerta-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # PostgreSQL + PostGIS (Supabase: Connect → Session pooler → URI)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Firebase Authentication
      - key: FIREBASE_PROJECT_ID
        value: agua-alerta-mx
      # Solo el sitio público y sus canales de vista previa de Firebase (reemplaza el regex de red local)
      - key: CORS_ORIGINS
        value: https://agua-alerta-mx.web.app,https://agua-alerta-mx.firebaseapp.com
      - key: CORS_ORIGIN_REGEX
        value: ^https://agua-alerta-mx(--[a-z0-9-]+)?\.web\.app$
      # Fotos en Supabase Storage (API compatible con S3)
      - key: STORAGE_BACKEND
        value: s3
      - key: S3_BUCKET
        value: report-photos
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Correo de quien administra; entra con Firebase usando ese correo (verificado)
      - key: BOOTSTRAP_SUPERADMIN_EMAIL
        sync: false
      - key: PASSWORD_RESET_DEV_EXPOSE_TOKEN
        value: "false"
      - key: LOG_LEVEL
        value: INFO
