services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agua}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agua_secret}
      POSTGRES_DB: ${POSTGRES_DB:-agua_alerta}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agua} -d ${POSTGRES_DB:-agua_alerta}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-agua}:${POSTGRES_PASSWORD:-agua_secret}@db:5432/${POSTGRES_DB:-agua_alerta}
      PASSWORD_RESET_DEV_EXPOSE_TOKEN: ${PASSWORD_RESET_DEV_EXPOSE_TOKEN:-true}
    ports:
      - "8000:8000"
    volumes:
      - ./data/photos:/data/photos
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${DOCKER_WEB_API_BASE_URL:-/api/v1}
        VITE_MAP_TILE_URL: ${VITE_MAP_TILE_URL:-}
        VITE_MAP_TILE_ATTRIBUTION: ${VITE_MAP_TILE_ATTRIBUTION:-}
        VITE_TILE_URL: ${VITE_TILE_URL:-}
        VITE_TILE_ATTRIBUTION: ${VITE_TILE_ATTRIBUTION:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "3080:80"
      - "8081:80"
    depends_on:
      - api

volumes:
  pgdata: